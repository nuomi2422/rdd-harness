<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RDD Harness 面板</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     RDD Harness 面板 · 视觉参考《明日方舟》罗德岛终端 / PRTS 风格
     色值与视觉特征由 model_router(to=deepseek) 于 2026-10-05 反推给出，
     官方没有公开色板，所以这是一套「按实机 UI 视觉反推的自洽值」。

     这个主题真正决定长相的不是颜色，是这几条禁令（照着反面清单做的）：
       圆角 0（全站 border-radius:0）｜无渐变按钮｜无柔和投影/发光｜
       无 emoji｜无胶囊按钮｜无毛玻璃｜无聊天气泡｜无平滑弹性动画
     真正在做的四件事：
       ① 45° 切角（右上角切 11px，用 ::after 叠页面底色切出来 —— 这样真边框还在）
       ② 1px 细边框 + 关键面板的双线框（外框 + 内缩一根）
       ③ 拉丁标签全大写 + letter-spacing，数字一律 tabular-nums
       ④ 高密度：1px 细横线分隔、方括号标签 [ STATIC ]，不用留白泡
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --bg-base:#17181A; --bg-panel:#212226; --bg-card:#2B2C31; --bg-sunk:#141517;
    --line:#3A3C42; --line-strong:#5A5D66;
    --accent:#F9B93F; --accent-dim:#B8892F; --accent-2:#3ED1E8;
    --tx:#E6E7E9; --tx-2:#9A9DA3; --tx-3:#5A5D63;
    --ok:#45C46A; --warn:#F9B93F; --danger:#E8443A; --info:#3EA6FF;
    --hover:rgba(255,255,255,.06); --sel:rgba(249,185,63,.14);
    --mono:Consolas,"Cascadia Mono","Roboto Mono",monospace;
  }
  *{box-sizing:border-box; border-radius:0 !important}
  html,body{background:var(--bg-base); color:var(--tx)}
  body{margin:0;
       font:13.5px/1.55 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
       /* 极淡网格底：终端感，几乎看不见但少了会觉得「太干净」 */
       background-image:
         linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
         linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
       background-size:34px 34px}
  /* 扫描线：整页一层横纹，不干扰阅读 */
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
       background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  code,kbd{background:var(--bg-sunk);border:1px solid var(--line);padding:0 5px;
           font:11.5px/1.6 var(--mono);color:var(--accent)}
  a{color:var(--accent-2);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ── 切角：右上 11px。靠 ::after 叠底色切掉，所以真边框没丢 ── */
  .cut{position:relative}
  .cut::after{content:'';position:absolute;top:-1px;right:-1px;width:11px;height:11px;
              background:var(--bg-base);
              clip-path:polygon(100% 0,0 0,100% 100%)}
  .cut.cl::after{left:-1px;right:auto;top:auto;bottom:-1px;
                 clip-path:polygon(0 100%,100% 100%,0 0)}
  /* 关键面板的双线框：外框 1px + 内缩一根 1px */
  .frame{border:1px solid var(--line-strong);box-shadow:none;padding:1px;background:var(--line)}
  .frame>.in{background:var(--bg-panel);padding:14px 16px}

  /* ── 顶栏 ── */
  .bar{position:sticky;top:0;z-index:30;background:rgba(23,24,26,.97);
       border-bottom:1px solid var(--line-strong);padding:0 16px;
       display:flex;gap:14px;align-items:stretch;min-height:40px}
  .bar h1{font-size:12px;margin:0;padding:13px 0;letter-spacing:.22em;color:var(--accent);
          text-transform:uppercase;font-weight:700;white-space:nowrap}
  .nav{display:flex}
  .nav button{background:transparent;color:var(--tx-2);border:0;border-right:1px solid var(--line);
              padding:0 14px;font:600 11.5px/1 inherit;letter-spacing:.16em;text-transform:uppercase;
              cursor:pointer}
  .nav button:hover{background:var(--hover);color:var(--tx)}
  .nav button.on{background:var(--sel);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .bar .sp{flex:1}
  .wrap{max-width:1560px;margin:0 auto;padding:16px 16px 60px}

  /* ── 卡片 ── */
  .card{background:var(--bg-panel);border:1px solid var(--line);padding:14px 16px;position:relative}
  .card>h2{font-size:11px;margin:0 0 12px;color:var(--tx-2);font-weight:700;letter-spacing:.2em;
           text-transform:uppercase;display:flex;align-items:center;gap:10px;
           border-bottom:1px solid var(--line);padding-bottom:7px}
  .card>h2::before{content:'[ ';}
  .card>h2::after{content:' ]';color:var(--tx-3)}
  .card>h2 .r{margin-left:auto;font-weight:400;letter-spacing:.06em;text-transform:none;
              color:var(--tx);font-size:12px;display:flex;align-items:center;gap:8px}

  /* ── 方括号标签（替代 pill）── */
  .tag{display:inline-block;font:600 10.5px/1.7 var(--mono);letter-spacing:.08em;
       padding:0 6px;border:1px solid var(--line-strong);color:var(--tx-2);text-transform:uppercase}
  .tag.ok{color:var(--ok);border-color:#2C5A38} .tag.warn{color:var(--warn);border-color:#6B5420}
  .tag.bad{color:var(--danger);border-color:#6B2A26} .tag.acc{color:var(--accent);border-color:var(--accent-dim)}
  .tag.cy{color:var(--accent-2);border-color:#22626E}

  /* ── 按钮：方角 1px，hover 叠白不改色相 ── */
  button.b{background:var(--bg-card);color:var(--tx);border:1px solid var(--line-strong);
           padding:3px 10px;font:600 11px/1.7 inherit;letter-spacing:.1em;text-transform:uppercase;
           cursor:pointer;white-space:nowrap}
  button.b:hover{background:var(--hover);border-color:var(--accent);color:var(--accent)}
  button.b.p{border-color:var(--accent-dim);color:var(--accent)}
  button.b.p:hover{background:var(--sel)}
  button.b:disabled{opacity:.35;cursor:not-allowed}
  input[type=search],input[type=text]{background:var(--bg-sunk);border:1px solid var(--line-strong);
       color:var(--tx);padding:5px 9px;font:12.5px var(--mono);outline:none}
  input[type=search]:focus{border-color:var(--accent)}

  /* ── 表格：1px 细横线，无斑马纹 ── */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--tx-2);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
     position:sticky;top:40px;background:var(--bg-panel);z-index:2;
     border-bottom:1px solid var(--line-strong)}
  tbody tr:hover td{background:var(--hover)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td b,th b{font-weight:600}

  /* ── 说明块：左边 2px 竖线，不用圆角气泡 ── */
  .note{border-left:2px solid var(--line-strong);padding:1px 0 1px 11px;margin:7px 0;
        font-size:12.5px;color:var(--tx-2)}
  .note.ok{border-color:var(--ok)} .note.warn{border-color:var(--warn)} .note.bad{border-color:var(--danger)}
  .note.acc{border-color:var(--accent)}
  .note b{color:var(--tx)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
  .kv b{color:var(--tx-2);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
        font-size:10.5px;padding-top:2px;white-space:nowrap}

  /* ── 进度条：方角 + 45° 斜纹填充（不用渐变）── */
  .bar2{height:9px;background:var(--bg-sunk);border:1px solid var(--line-strong);position:relative;overflow:hidden}
  .bar2>i{display:block;height:100%;
    background:repeating-linear-gradient(45deg,var(--accent) 0 5px,#8A6A22 5px 10px)}

  /* ── 阶段条 ── */
  .steps{display:flex;flex-wrap:wrap;margin-top:11px;border:1px solid var(--line)}
  .step{border:0;border-right:1px solid var(--line);padding:5px 11px;font:600 11px/1.6 inherit;
        letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
  .step:last-child{border-right:0}
  .step.cur{background:var(--sel);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .step.done{color:var(--ok)}

  /* ── 决策卡：左边 3px 类别色 + 切角 ── */
  .dec{background:var(--bg-card);border:1px solid var(--line);border-left:3px solid var(--accent);
       padding:13px 15px;margin:11px 0;position:relative}
  .dec.arch{border-left-color:var(--accent)} .dec.risk{border-left-color:#E07A3C}
  .dec .t{font-weight:600;margin:0 0 5px;font-size:14px;color:var(--tx)}
  .dec .why{font-size:12.5px;color:var(--tx-2);white-space:pre-wrap;margin:0 0 9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--bg-sunk);
       border:1px solid var(--line);color:var(--tx);padding:8px 12px;margin:6px 0;
       font:inherit;cursor:pointer}
  .opt:hover{border-color:var(--accent);background:var(--sel)}
  .opt .k{flex:0 0 22px;height:22px;background:var(--bg-card);border:1px solid var(--line-strong);
          display:flex;align-items:center;justify-content:center;font:700 11px var(--mono);color:var(--accent)}
  .opt .l{font-size:13px;font-weight:600}
  .opt .c{font-size:12px;color:var(--tx-2)}
  .tag.rec{color:var(--accent);border:1px solid var(--accent-dim);background:var(--sel);margin-left:6px}
  .tag.warn{color:var(--warn);border:1px solid #6B5420;margin-left:6px}

  textarea{width:100%;background:var(--bg-sunk);border:1px solid var(--line-strong);color:var(--tx);
           padding:10px 12px;font:12.5px/1.75 var(--mono);resize:vertical;min-height:400px;outline:none}
  textarea:focus{border-color:var(--accent)}

  /* ── 目录浏览 ── */
  .listdir{border:1px solid var(--line);padding:6px 9px;background:var(--bg-sunk);
           font:12px/1.8 var(--mono);max-height:210px;overflow:auto}
  .listdir div{cursor:pointer}
  .listdir div:hover{background:var(--sel);color:var(--accent)}
  .listdir div span{color:var(--tx-3)}

  .empty{color:var(--tx-3);font-size:12.5px}
  .pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 var(--mono);color:var(--tx-2);
       max-height:540px;overflow:auto;background:var(--bg-sunk);border:1px solid var(--line);padding:10px 12px}
  .tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:11px}
  .tabs button{background:transparent;border:0;border-right:1px solid var(--line);color:var(--tx-2);
               padding:6px 13px;font:600 11.5px/1.5 inherit;letter-spacing:.1em;cursor:pointer;
               text-transform:uppercase}
  .tabs button.on{background:var(--sel);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .tabs button:hover{background:var(--hover);color:var(--tx)}
  .toast{position:fixed;right:16px;bottom:16px;background:var(--bg-card);
         border:1px solid var(--accent);padding:9px 14px;font:12.5px var(--mono);display:none;z-index:60;max-width:62vw}
  .toast.on{display:block}
  .toast.bad{border-color:var(--danger);color:#FFB9B4}
  .hide{display:none !important}
  .grid{display:grid;gap:13px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:var(--bg-sunk)}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border:1px solid var(--bg-sunk)}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-dim)}
</style>
</head>
<body>
<div class="bar">
  <h1>RDD Harness 面板</h1>
  <div class="nav" id="nav"></div>
  <div class="sp"></div>
  <span class="tag" id="stamp">…</span>
  <button class="b" onclick="location.reload()">刷新</button>
  <span class="toast" id="toast"></span>
</div>
<div class="wrap" id="view"><div class="card empty">读取中…</div></div>

<script>
const $ = (i)=>document.getElementById(i);
let OV=null, PAGE='老板台', TOOLS=null, TOOLQ='', GRP='*';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb = n => n>1048576 ? (n/1048576).toFixed(1)+'M' : n>1024 ? (n/1024).toFixed(1)+'K' : n+'B';

async function J(url, opts){
  const r = await fetch(url, opts);
  return r.json();
}
async function post(url, body){
  return J(url, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body||{})});
}
let tT=null;
function toast(m, bad){
  const t=$('toast'); t.textContent=m; t.className='toast on'+(bad?' bad':'');
  clearTimeout(tT); tT=setTimeout(()=>{t.className='toast'+(bad?' bad':'');}, bad?10000:5000);
}
async function openPath(p){
  const r = await post('/api/open', {path:p});
  if(!r.ok) toast('[!] '+(r.why||'打不开'), true);
}
async function saveDoc(id, content){
  const r = await post('/api/save', {id, content});
  toast((r.ok ? '[+] ' : '[!] ')+(r.msg||r.why), !r.ok || r.verified===false);
  return r;
}

const NAV = [
  ['老板台','boss'], ['总览','ov'], ['决策收件箱','dec'], ['AI 进度','stage'],
  ['工具','tools'], ['纪律','rules'], ['文件','files'], ['额度','budget'], ['诊断','diag'],
];

function paintNav(){
  $('nav').innerHTML = NAV.map(([t,k])=>
    '<button class="'+(PAGE===t?'on':'')+'" onclick="go(\''+k+'\')">'+esc(t)+'</button>').join('');
}
function go(k){
  PAGE = NAV.find(x=>x[1]===k)[0];
  paintNav(); paint();
}
window.go = go;

// ══════════════════════════════════════════════ 总览
function paintOverview(){
  const h = OV.harness || {}, b = OV.budget || {}, A = OV.stage && OV.stage.active;
  const dec = OV.decisions || {};
  let s = '';

  s += '<div class="grid g2">';

  // harness 体检
  s += '<div class="card cut"><h2>harness 体检 <span class="r"><span class="tag '+(h.ok?'ok':'bad')+'">'+
       (h.ok?'健康':'有问题')+'</span></span></h2>';
  s += '<div class="kv">';
  s += '<b>工具</b><span>'+(h.tools||0)+' 条　·　id '+(h.idUnique?'唯一':'· 有重复')+
       '　·　路径落地 '+(h.pathMissing&&h.pathMissing.length?('· 缺 '+h.pathMissing.length):'全在')+'（跳过 '+(h.skipped||0)+' 个游戏内指令）</span>';
  s += '<b>编程规范</b><span>'+(h.standardClauses||0)+' 条带 id 的条款　·　'+kb(h.standardBytes||0)+'</span>';
  s += '<b>门禁</b><span>preflight '+(h.gates?h.gates.preflight:0)+' 项　·　postflight '+(h.gates?h.gates.postflight:0)+' 项</span>';
  s += '<b>时间锁</b><span>'+(h.locksOpen||0)+'/'+(h.locks||0)+' open　'+(h.locksOverdue&&h.locksOverdue.length?'<span class="tag bad">'+h.locksOverdue.length+' 条已过期</span>':'没到期')+'</span>';
  s += '<b>历史 bug</b><span>'+(h.bugs||0)+' 条已登记　·　文档编号 max '+(h.docNo||'?')+'</span>';
  s += '</div>';
  (h.notes||[]).forEach(n=>{ s += '<div class="note '+n.lv+'">'+(n.lv==='bad'||n.lv==='warn')?'[!] ':'[+] '+esc(n.t)+'</div>'; });
  s += '<div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap">'+
       '<button class="b p" onclick="runSelftest()">跑 harness selftest</button>'+
       '<button class="b" onclick="runGate(\'preflight\')">preflight</button>'+
       '<button class="b" onclick="runGate(\'postflight\')">postflight</button></div>';
  s += '</div>';

  // 当前 stage
  s += '<div class="card cut"><h2>AI 现在做到哪儿 <span class="r">'+(A?'<button class="b" onclick="go(\'stage\')">详情</button>':'')+'</span></h2>';
  if(!A){ s += '<div class="empty">没有进行中的 stage 任务。AI 没在跑流程 —— 要开一条：<code>stager start "&lt;需求&gt;"</code></div>'; }
  else {
    const st=A.stage, sd=A.stageDef||{};
    s += '<div class="kv">';
    s += '<b>阶段</b><span><b style="color:var(--fg);font-size:15px">'+(sd.icon||'')+' '+esc(sd.name||st.stage)+'</b>　('+
         (((sd._i||0)+1))+'/'+(A.stageCount||0)+')　<code>'+esc(st.stage)+'</code></span>';
    s += '<b>任务</b><span>'+esc(st.title||st.id)+'</span>';
    s += '<b>轮次</b><span>第 '+st.round+'/'+st.maxRounds+' 轮　·　轮回 '+(st.wrap||0)+' 次　·　人次 '+esc(st.actor)+'</span>';
    s += '<b>门禁</b><span>'+(A.need.length? '<span class="tag bad">还差 '+esc(A.need.join(' '))+'</span>'
                                          : '<span class="tag ok">[+] 达标，可以 stager next</span>')+'</span>';
    s += '</div>';
    s += '<div class="bar2" style="margin-top:11px"><i style="width:'+Math.round((((sd._i||0)+1)/(A.stageCount||1))*100)+'%"></i></div>';
    s += '<div class="steps">'+(A.stageList||[]).map((x,i)=>{
      const done = (sd._i||0) > i;
      return '<div class="step'+(x.id===st.stage?' cur':'')+(done?' done':'')+'">'+(i+1)+' '+esc(x.name||x.id)+'</div>';
    }).join('')+'</div>';
    if(sd.brief) s += '<div class="note" style="margin-top:10px">'+esc(sd.brief)+'</div>';
  }
  s += '</div>';
  s += '</div>';

  // 待办三合一
  s += '<div class="grid g3">';
  s += '<div class="card cut"><h2>等你拍板 <span class="r">'+(dec.pending&&dec.pending.length
        ? '<button class="b p" onclick="go(\'dec\')">去收件箱</button>':'')+'</span></h2>';
  if(!dec.pending || !dec.pending.length) s += '<div class="empty">没有。AI 要么在自己写，要么在问你之前已经把该查的查完了。</div>';
  else (dec.pending||[]).forEach(d=>{ s += '<div class="note warn" style="border-left-color:#e07a3c">[>] <b>'+esc(d.id)+'</b> '+
    esc(d.title)+(d.forced?' <span class="tag warn">强制入队</span>':'')+'</div>'; });
  s += '</div>';

  s += '<div class="card cut"><h2>门禁还差</h2>';
  if(!A || !A.need.length) s += '<div class="empty">'+(A?'[+] 都达标了':'（没有进行中的任务）')+'</div>';
  else A.need.forEach(n=>{ s += '<div class="note bad">[!] '+esc(n)+'</div>'; });
  s += '</div>';

  s += '<div class="card cut"><h2>服务活没活</h2>';
  (OV.ports||[]).forEach(p=>{
    s += '<div style="display:flex;gap:9px;align-items:center;padding:3px 0;font-size:12.5px">'+
      '<span class="tag '+(p.alive?'ok':'bad')+'">'+(p.alive?'ON':'OFF')+'</span>'+
      '<b style="font-weight:500">'+esc(p.name)+'</b>'+
      '<span style="color:var(--dim)">:'+p.port+'</span>'+
      '<span style="color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.why)+'</span>'+
      (p.url?'<a href="'+esc(p.url)+'" target="_blank">开</a>':'')+'</div>';
  });
  s += '</div>';
  s += '</div>';

  // 文件位置
  s += '<div class="card cut"><h2>文件都在哪 <span class="r"><button class="b" onclick="go(\'files\')">文件管理</button></span></h2>';
  s += '<table><tr><th>用途</th><th>路径</th><th>在不在</th><th></th></tr>';
  (OV.roots||[]).forEach(r=>{
    s += '<tr><td>'+esc(r.label)+'</td><td><code>'+esc(r.path)+'</code></td>'+
      '<td>'+(r.exists?'<span class="tag ok">在</span>':'<span class="tag bad">没了</span>')+'</td>'+
      '<td><button class="b" onclick="openPath(\''+esc(r.path).replace(/\\/g,'\\\\')+'\')">打开</button></td></tr>';
  });
  s += '</table></div>';

  return s;
}

// ══════════════════════════════════════════════ 决策收件箱
function paintDecide(){
  let s = '<div class="card cut"><h2>决策收件箱</h2>';
  const P = (OV.decisions||{}).policy||{};
  if(P.ok){
    s += '<div class="note" style="border-color:var(--acc)"><b>这里只放该你拍板的</b>：'+
      P.risks.map(r=>'【'+esc(r.label)+'】'+esc(r.means)).join('　｜　')+

  s += '</div>';

async function pick(id, choice, btn){

  box && box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const r = await post('/api/decide', {id, choice, note});
  if(!r.ok){ toast('[!] 没选成：'+(r.why||''), true); box && box.querySelectorAll('.opt').forEach(b=>b.disabled=false); return; }
  toast('[+] '+id+' 已定 → 已存 '+r.file, false);

}
async function dismiss(id){

  const r = await saveDoc(CURDOC, t.value);

}

  showOut(r.output);
}
window.runSelftest=runSelftest; window.runGate=runGate; window.runRepo=runRepo;
window.openPath = openPath;

// ══════════════════════════════════════════════ 主循环
// ══════════════════════════════════════════════ 老板台（2026-10-20 用户要求）
// 用户原话：「我无法快速拿到想要的文件，我要自己发文件夹，很麻烦」
// 所以这一页只做一件事：把「今天该看什么」摆在最上面，三行大白话直接可见，
// 点标题才进全文。不合格的日报标红并写出问题，不让它混过去。
let BOSS = null;
async function paintBoss(){
  // 数据由 refresh() 统一拉（避免每 5 秒重复请求）；这里只兜底第一次
  if(BOSS===null){
    try{ BOSS = await J('/api/boss'); }
    catch(e){ return '<div class="card cut"><div class="note bad">[!] 读不出日报：'+esc(e.message)+'</div></div>'; }
  }
  if(BOSS && BOSS.err){
    return '<div class="card cut"><div class="note bad">[!] 读不出日报：'+esc(BOSS.err)+'</div></div>';
  }
  const B = BOSS, items = B.items || [];
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  // ★ 跨夜会出问题：0 点一过「今天」就没有日报了，而人还在干 10-20 的活。
  //   所以今天为空时，回退到「最近有日报的那一天」，并明说这是哪天的。
  const newestDate = items.length ? items[0].date : '';
  const showDate = items.some(x=>x.date===today) ? today : newestDate;
  const isFallback = showDate !== today;
  const todays = items.filter(x=>x.date===showDate);
  const older = items.filter(x=>x.date!==showDate);

  let s = '';

  // 今天该看的
  const fmt = d => d && d.length===8 ? d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8) : (d||'');
  const headLabel = isFallback
    ? '最近一次日报（'+fmt(showDate)+'，今天还没写新的）'
    : '今天要你看的';
  s += '<div class="card cut"><h2>'+headLabel+' <span class="r">'+
       (todays.length ? todays.length+' 份' : '<span class="tag bad">还没有日报</span>')+'</span></h2>';
  if(!todays.length){
    s += '<div class="note bad">还没有日报。让 AI 在 rdd存放\\ 写一份，顶部必须有「给老板的三行」。</div>';
  }else{
    s += todays.map(x=>bossCard(x,true)).join('');
  }
  s += '</div>';

  // 历史
  if(older.length){
    s += '<div class="card cut"><h2>更早的 <span class="r">'+older.length+' 份</span></h2>';
    s += older.slice(0,12).map(x=>bossCard(x,false)).join('');
    s += '</div>';
  }

  s += '<div class="card cut"><h2>说明</h2><div class="note">'+
       '这一页只列 <code>rdd存放\\</code> 里的日报。判定与 goal 的验收同口径：'+
       '三行必须齐（①②③）、不超过 250 字、不出现批次号/判据/契约/文件名/sha、不写空话。'+
       '不合格的会标红并写出原因 —— 那是要 AI 重写的，不是给你凑合看的。</div></div>';
  return s;
}

// 去掉 markdown 标记：老板台是给人快速扫的，星号/反引号只会碍眼
function plainMd(s){
  return String(s||'').replace(/\*\*/g,'').replace(/`/g,'').replace(/^#+\s*/gm,'').trim();
}

function bossCard(x, isToday){
  const bad = !x.ok;
  let s = '<div class="docrow" style="padding:10px 0;border-top:1px solid var(--line)">';
  // 标题行：点进全文
  s += '<div style="display:flex;align-items:baseline;gap:8px">';
  s += '<a href="#" onclick="bossOpen(\''+esc(x.file).replace(/'/g,"\\'")+'\');return false" '+
       'style="font-weight:600;color:var(--tx);text-decoration:none">'+esc(plainMd(x.title))+'</a>';
  s += '<span class="tag '+(bad?'bad':'ok')+'">'+(bad?'不合格':'三行合规')+'</span>';
  s += '<span class="r" style="margin-left:auto;color:var(--tx-2);font-size:11.5px">'+
       esc(x.date||'')+' · '+(x.threeChars||0)+' 字</span>';
  s += '</div>';
  // 三行正文（这是重点，直接显示）
  // ★ 三行是给人快速读的，不该出现 markdown 符号：去掉 ** / ` 这类标记
  if(x.three){
    const plain = plainMd(x.three);
    s += '<div style="margin:8px 0 0;white-space:pre-wrap;line-height:1.75;font-size:13.5px">'+
         esc(plain)+'</div>';
  }else{
    s += '<div class="note bad" style="margin-top:6px">没有「给老板的三行」这一节。</div>';
  }
  // 问题清单
  if(x.problems && x.problems.length){
    s += '<div class="note bad" style="margin-top:6px">问题：'+esc(x.problems.join('；'))+'　→ 让 AI 重写</div>';
  }
  s += '</div>';
  return s;
}

// 点标题看全文（复用已有的 /api/doc 机制）
window.bossOpen = async function(file){
  const rel = 'rdd存放/' + file;
  try{
    const d = await J('/api/doc/' + encodeURIComponent(rel));
    const html = '<div class="card cut"><h2>'+esc(file)+
      ' <span class="r"><button class="b" onclick="go(\'boss\')">← 回老板台</button></span></h2>'+
      '<div style="white-space:pre-wrap;line-height:1.8;font-size:13px">'+esc(d.text||'')+'</div></div>';
    $('view').innerHTML = html;
    curTab = 'boss-full';
  }catch(e){
    $('view').innerHTML = '<div class="card cut"><div class="note bad">[!] 打不开：'+esc(e.message)+
      '　<a href="#" onclick="go(\'boss\');return false">← 回去</a></div></div>';
  }
};

const PAINT = {boss:paintBoss, ov:paintOverview, dec:paintDecide, stage:paintStage, tools:paintTools,
               rules:paintRules, files:paintFiles, budget:paintBudget, diag:paintDiag};
let curTab = null;
function paint(){
  paintNav();
  const k = NAV.find(x=>x[0]===PAGE)[1];
  // 规则页重绘会把光标弹走，所以只在第一次或换页时才整体重绘
  if(k===curTab && k!=='rules') return;
  curTab = k;
  const fn = PAINT[k]||paintOverview;
  const out = fn();
  // ★ 异步渲染页（老板台要读 /api/boss）返回 Promise，必须 resolve 后再塞 innerHTML，
  //   否则页面上会出现 "[object Promise]"（同步 paint 的老写法没这个问题，是新增页带来的）。
  if(out && typeof out.then==='function'){
    out.then(html=>{ if(curTab===k) $('view').innerHTML = html; })
       .catch(e=>{ $('view').innerHTML = '<div class="card cut"><div class="note bad">[!] 渲染失败：'+esc(e.message)+'</div></div>'; });
  }else{
    $('view').innerHTML = out;
  }
  if(k==='rules' && CURDOC) openDoc(CURDOC);
}
async function refresh(){
  try{
    const needTools = (PAGE==='tools');
    OV = await J('/api/overview');
    if(needTools) TOOLS = await J('/api/tools');
    // 老板台要单独拉日报列表（不进 overview，避免总览变慢）
    if(PAGE==='老板台'){ try{ BOSS = await J('/api/boss'); }catch(e){ BOSS = {ok:false,items:[],err:e.message}; } }
    $('stamp').innerHTML = '更新于 '+new Date(OV.now).toLocaleTimeString()+' · 每 5 秒自动刷新';
    if(TOOLS===null && PAGE==='tools') TOOLS = await J('/api/tools');
    paint();
  }catch(e){
    $('view').innerHTML = '<div class="card cut"><div class="note bad">[!] 读不出来：'+esc(e.message)+
      '　（面板进程还在吗？端口 8891 被别的程序占了吗？）</div></div>';
  }
}
(async function(){
  paintNav();
  await refresh();
  setInterval(()=>{ if(PAGE!=='rules') refresh(); else J('/api/overview').then(o=>{OV=o; $('stamp').textContent='更新于 '+new Date(OV.now).toLocaleTimeString();}).catch(()=>{}); }, 5000);
})();
</script>
