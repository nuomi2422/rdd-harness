<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness 老板台</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#d7dce5; --dim:#8b93a3; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
  header { padding:18px 22px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 4px; font-weight:600; }
  #status { color:var(--dim); font-size:13px; }
  main { padding:18px 22px 40px; max-width:1100px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--dim); font-weight:600; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .dim{color:var(--dim)}
  ul { margin:0; padding-left:18px; } li { margin:3px 0; }
  .src { color:var(--dim); font-size:12px; }
  a { color:#7dd3fc; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>Harness 老板台</h1>
  <div id="status">加载中…</div>
</header>
<main>
  <section>
    <h2>门禁 × 工作区覆盖</h2>
    <table id="cover"><thead><tr><th>项</th><th>状态</th><th>数据源</th></tr></thead><tbody></tbody></table>
  </section>
  <section>
    <h2>最近汇报</h2>
    <ul id="reports"><li class="dim">加载中…</li></ul>
  </section>
  <section>
    <h2>决策</h2>
    <ul id="decisions"><li class="dim">加载中…</li></ul>
  </section>
</main>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function row(name, state, cls, src){
  const tr=document.createElement('tr');
  tr.innerHTML='<td>'+esc(name)+'</td><td class="'+cls+'">'+esc(state)+'</td><td class="src">'+esc(src)+'</td>';
  return tr;
}
async function load(){
  try{
    const r=await fetch('/api/simple',{cache:'no-store'});
    const d=await r.json();
    document.getElementById('status').textContent =
      '只读 · ' + new Date(d.at).toLocaleString('zh-CN') +
      ' · 薄写码门禁 ' + (d.gates.thinPreCode.installed?'已装':'未装') +
      ' · preflight ' + d.gates.preflight + ' 项 / postflight ' + d.gates.postflight + ' 项' +
      ' · 汇报 ' + d.reports.length + ' 条 · 待决策 ' + d.decisions.length + ' 条';
    const tb=document.querySelector('#cover tbody'); tb.innerHTML='';
    tb.appendChild(row('写代码前薄门禁', d.gates.thinPreCode.installed?'已装':'未装（待装）', d.gates.thinPreCode.installed?'ok':'warn', 'registry / 约定'));
    tb.appendChild(row('进游戏前 preflight', d.gates.preflight + ' 项', d.gates.preflight?'ok':'warn', 'registry.gates.preflight.checks'));
    tb.appendChild(row('退游戏后 postflight', d.gates.postflight + ' 项', d.gates.postflight?'ok':'warn', 'registry.gates.postflight.checks'));
    tb.appendChild(row('写代码区：工具 / 文档登记 / 读文章', d.work.coding.tools + ' / ' + d.work.coding.docs + ' / UNKNOWN', 'warn', 'registry.tools / docNumbers；读文章暂无采集'));
    tb.appendChild(row('验证区：工具 / 门禁', d.work.verify.tools + ' / ' + d.work.verify.gates, 'ok', 'registry.tools / gates'));
    tb.appendChild(row('退游戏区：汇报 / 写文件', d.work.exit.reports + ' / UNKNOWN', 'warn', '知识库/记录；写文件数暂无采集'));
    const rl=document.getElementById('reports'); rl.innerHTML='';
    if(!d.reports.length){ rl.innerHTML='<li class="dim">暂无汇报（写入 知识库/记录/）</li>'; }
    else d.reports.slice(0,8).forEach(x=>{ const li=document.createElement('li'); li.innerHTML=esc(x.name)+' <span class="dim">'+esc(x.mtime)+'</span>'; rl.appendChild(li); });
    const dl=document.getElementById('decisions'); dl.innerHTML='';
    if(!d.decisions.length){ dl.innerHTML='<li class="dim">暂无待决策</li>'; }
    else d.decisions.slice(0,8).forEach(x=>{ const li=document.createElement('li'); li.textContent=(x.at||'')+' · '+(x.title||x.question||x.id||''); dl.appendChild(li); });
  }catch(e){
    document.getElementById('status').textContent='加载失败：'+e.message;
  }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
